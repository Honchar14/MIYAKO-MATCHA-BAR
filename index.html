<style>
/* Layout: a fixed 1920x1080 stage (coordinates straight from the Figma frame) scaled to fit. */
:root {
  --ink: #070606;        /* loader background */
  --night: #000000;      /* hero base */
  --cream: #F6F3EA;
  --matcha: #C5E45A;
  --matcha-deep: #242A24;
  --cream-40: rgba(246, 243, 234, .4);
  --matcha-40: rgba(197, 228, 90, .4);
  --f-display: "Badeen Display", "Arial Black", Impact, sans-serif;
  --f-grot: "Helvetica Neue", Helvetica, Arial, "Noto Sans JP", sans-serif;
  --f-inter: "Inter", "Helvetica Neue", Arial, sans-serif;
  --f-jp: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
p { margin: 0; }
body {
  background: var(--ink); color: var(--cream); font-family: var(--f-grot);
  display: flex; flex-direction: column; overflow: hidden;
}

/* ---------- stage ---------- */
.viewport {
  flex: 1; min-height: 0; display: grid; place-items: center;
  padding-block: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.frame { position: relative; overflow: hidden; clip-path: inset(0); background: var(--ink); }
.stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
.abs { position: absolute; }
.trim { text-box: trim-both cap alphabetic; }

/* loader */
.loader { position: absolute; inset: 0; background: var(--ink); }
.grain { position: absolute; inset: -40px; opacity: .09; pointer-events: none; mix-blend-mode: screen; }
.logo-word { font: 400 188px/1 var(--f-display); color: var(--cream); text-transform: uppercase; white-space: nowrap; text-shadow: 4px 4px 8px rgba(0,0,0,.4); }
.tag { font: 700 22px/1.08 var(--f-grot); color: var(--matcha); text-transform: uppercase; letter-spacing: -.88px; white-space: nowrap; }
.kanji { font: 600 22px/1.08 var(--f-inter); color: var(--matcha); letter-spacing: -.88px; left: 960px; transform: translateX(-50%); }
.count { left: 30px; top: 875px; font: 400 188px/1 var(--f-display); color: var(--matcha); text-shadow: 4px 4px 8px rgba(0,0,0,.4); font-variant-numeric: tabular-nums; transform-origin: 0 100%; }
.track { left: 30px; top: 1037px; width: 1860px; height: 13px; box-sizing: border-box; transform-origin: 0 50%; }
.group { position: absolute; inset: 0; pointer-events: none; }
/* logo reel window: feathered top and bottom edges (--fe set per cell), like a feathered mask in After Effects */
.cell { position: absolute; overflow: visible;
  -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 var(--fe, 30px), #000 calc(100% - var(--fe, 30px)), transparent 100%);
          mask-image: linear-gradient(to bottom, transparent 0, #000 var(--fe, 30px), #000 calc(100% - var(--fe, 30px)), transparent 100%); }
.cell.rest { -webkit-mask-image: none; mask-image: none; }
.strip { position: absolute; left: 0; top: 0; width: 100%; }
.row { display: block; white-space: nowrap; text-align: center; overflow: visible; }
.row span { display: inline-block; }
.row.lat { font-family: var(--f-display); color: var(--cream); text-transform: uppercase; text-shadow: 4px 4px 8px rgba(0,0,0,.4); }
.row.lat.small { font-family: var(--f-grot); font-weight: 700; color: var(--matcha); }
.row.jp { font-family: var(--f-jp); font-weight: 700; color: var(--cream); }
.row.jp.small { color: var(--matcha); }
#sit svg { width: 100%; height: 100%; display: block; overflow: visible; }
/* per-letter scramble: each slot is a tiny vertical reel clipped to its line; kanji take the text colour */
.scr { pointer-events: none; }
/* per-letter reel window: the slot reaches --fe above and below its line and --fx to the sides (padding, cancelled by a negative
   margin so the layout does not move) and the glyphs dissolve over that band instead of being cut off */
.scr { --fe: .35em; --fx: 2px; }
.scr .ch { position: relative; display: inline-block; padding: var(--fe) var(--fx); margin: calc(-1 * var(--fe)) calc(-1 * var(--fx));
  -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 var(--fe), #000 calc(100% - var(--fe)), transparent 100%);
          mask-image: linear-gradient(to bottom, transparent 0, #000 var(--fe), #000 calc(100% - var(--fe)), transparent 100%); }
.scr .l { visibility: hidden; }
/* static copy (manifesto, addresses, footer): letters never roll, so no per-letter mask — keeps the text crisp vector type */
.scr.still .ch { -webkit-mask-image: none; mask-image: none; }
/* vertical manifesto after it is written: one plain run of text instead of per-letter boxes (same metrics: no kerning,
   like the separate letter boxes), so the rotated line is drawn as ordinary type */
.vtext .pl { display: none; font-kerning: none; }
.vtext .plain .ch, .vtext .plain .hwo { display: none; }
.vtext .plain .pl { display: inline; }
.scr .ol { position: absolute; left: var(--fx); top: var(--fe); visibility: hidden; white-space: pre; }
.scr .k, .scr .ok { position: absolute; left: 50%; transform: translateX(-50%); font-family: var(--f-jp); font-weight: 700; letter-spacing: 0; color: inherit; visibility: hidden; white-space: nowrap; }
.nav .scr .k, .nav .scr .ok { color: var(--matcha); }
/* Japanese layer: rolling kanji use the layer's own font and position */
.scr.nat .k, .scr.nat .ok { left: var(--fx); top: var(--fe); font: inherit; letter-spacing: inherit; transform: none; }
/* English (in flow) + Japanese (absolute, positioned by JS) layers of a translatable text */
.dl.en { position: relative; display: inline-block; white-space: nowrap; }
.dl.jp { position: absolute; top: 0; left: 0; white-space: nowrap; }
.nav .dl.jp { color: var(--matcha); }
.progress { left: 30px; top: 1037px; width: 1860px; height: 13px; background: var(--matcha); transform-origin: 0 50%; }

/* hero */
/* overflow clips the photo (it is 8px wider than the screen on each side), so photo, dark shade and noise always move as one sheet */
.hero { position: absolute; inset: 0; background: var(--night); overflow: hidden; }
/* photo / video exactly the size of the screen: nothing overhangs the edge, so no layer can stick out past the shade */
.hero .bg { left: 0; top: 0; width: 1920px; height: 1080px; object-fit: cover; }
.hero video.bg { clip-path: inset(0); }
.hero .shade { inset: 0; background: rgba(0,0,0,.75); }
/* Figma: Multi noise, size 0.5, density 100%, opacity 30% — static on the main screen */
.hero .noise { inset: 0 -260px -260px 0; opacity: 0; pointer-events: none; background-size: 256px 256px; mix-blend-mode: plus-lighter; will-change: transform, opacity; image-rendering: pixelated;
  animation: grainBreath 1.2s ease-in-out infinite; }
/* three grain layers dissolve into each other (phases 0, 1/3, 2/3): brightness and contrast stay constant,
   the texture "boils" smoothly instead of jumping; a layer is moved only while it is fully transparent */
.hero .noise.n2 { animation-delay: -.4s; }
.hero .noise.n3 { animation-delay: -.8s; }
@keyframes grainBreath { 0%, 100% { opacity: 0; } 50% { opacity: .16; } }
@media (prefers-reduced-motion: reduce) { .hero .noise { animation: none; } .hero .noise.n1 { opacity: .18; } }
.vtext { width: 12px; }
.vtext > span {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) rotate(-90deg);
  font: 700 16px/1 var(--f-grot); letter-spacing: -.32px; text-transform: uppercase; white-space: nowrap;
}
.copy { font: 700 16px/1 var(--f-grot); letter-spacing: -.32px; text-transform: uppercase; color: var(--cream); }
.scr .w { white-space: nowrap; }
.scr .ch.ja { margin-right: calc(8px - var(--fx)); }
.hk { left: 960px; top: 29px; transform: translateX(-50%); overflow: visible; }

/* nav: fixed-size hit box (English width); the text flips to Japanese inside it */
.nav { left: 243px; top: 30px; display: flex; gap: 25px; }
.nav a { position: relative; display: block; color: var(--cream); text-decoration: none; height: 12px; transition: color .3s; }
.nav a.on { color: var(--matcha); }
.nav a .ul { position: absolute; left: -1px; top: 27px; height: 3px; pointer-events: none; clip-path: inset(-2px 100% -2px 0); }
.nav a .ul img { position: absolute; inset: 0; width: 100%; height: 100%; max-width: none; }
.nav a:focus-visible { outline: 1px solid var(--matcha); outline-offset: 6px; }

/* footer phrases: static, no hover */
.foot { left: 774px; top: 1038px; display: flex; gap: 46px; opacity: .4; }
.foot .ph { position: relative; display: block; height: 12px; cursor: inherit; }

/* buttons: brush pill outline + matcha liquid with a moving wave surface */
.btn {
  top: 730px; width: 336px; height: 100px; border-radius: 50px; display: grid; place-items: center;
  font: 700 22px/1 var(--f-grot); letter-spacing: -.44px; text-transform: uppercase; text-decoration: none;
}
.btn.fill { left: 599px; color: var(--matcha-deep); }
.btn.line { left: 985px; color: var(--matcha); transition: color .35s; }
.btn.line.on { color: var(--matcha-deep); }
.btn .pill { position: absolute; inset: 0; overflow: visible; pointer-events: none; }
.btn .liq { position: absolute; inset: 0; border-radius: 50px; overflow: hidden; pointer-events: none; isolation: isolate; -webkit-mask-image: -webkit-radial-gradient(white, black); }
.btn .lv { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
.btn .wave { position: absolute; left: 0; top: -14px; width: 200%; height: calc(100% + 40px); animation: wave 2.2s linear infinite; }
.btn .liq.hov .wave { animation-duration: 1.6s; animation-direction: reverse; }
@keyframes wave { to { transform: translateX(-50%); } }
.btn .t { position: relative; display: inline-block; white-space: nowrap; pointer-events: none; }

.flyer { transform-style: preserve-3d; }
.flyer img { position: absolute; inset: 0; width: 100%; height: 100%; }
.flyer .soft { filter: blur(6.3px); opacity: .7; }
.icn { position: absolute; }
.icn img { position: absolute; max-width: none; }
.uline { clip-path: inset(-4px 100% -4px 0); }
.ink { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; visibility: hidden; }
.ink .ink-en, .ink .ink-jp { fill: currentColor; }
.nav .ink .ink-jp { color: var(--matcha); }
.hwo { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; visibility: hidden; }

/* actor (frame-by-frame sprite) */
.actor { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: visible; }
.actor img { position: absolute; visibility: hidden; max-width: none; }
.actor img.on { visibility: visible; }
.clip { position: absolute; }
.clip img { position: absolute; inset: 0; width: 100%; height: 100%; max-width: none; visibility: hidden; }
.clip img.on { visibility: visible; }
/* the bowl and whisk leave the generated frame at its top edge: fade them out instead of a hard cut */
.clip-toss { -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 140px); mask-image: linear-gradient(to bottom, transparent 0, #000 140px); }
.prop { position: absolute; left: 0; top: 0; }
.actor, .clip, .prop { pointer-events: none; }

@media (prefers-reduced-motion: reduce) { .btn .wave { animation: none; } }
</style>
